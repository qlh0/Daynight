# application.yml 里的 alioss/wechat 用的是 ${sky.xxx} 占位符，
# 测试 profile 不会加载 application-dev.yml，所以这里必须给出具体值，否则启动时占位符解析失败
sky:
  alioss:
    endpoint: oss-cn-wuhan-lr.aliyuncs.com
    access-key-id: test-access-key
    access-key-secret: test-access-secret
    bucket-name: test-bucket
  wechat:
    appid: wx-test-appid
    secret: wx-test-secret
    # 测试时不调用真实微信接口，直接走本地兜底登录
    dev-mode: true

logging:
  level:
    com:
      sky:
        service: info
        mapper: info
